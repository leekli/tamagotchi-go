# golangci-lint v2 configuration. Linters are a blocking gate: fix what they
# flag rather than bypassing them. Inline //nolint directives need a specific
# linter name and an explanation (enforced by nolintlint).
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - cyclop
    - dupl
    - funlen
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign

  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      # Writes to stdout/stderr that fail leave nothing actionable to do.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 80
      statements: 50
    misspell:
      locale: UK
      # API identifiers and the conventional CLI flag name, not prose.
      ignore-rules:
        - color
        - center
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: unexported-return
        - name: errorf
        - name: context-as-argument
        - name: unreachable-code

  exclusions:
    generated: lax
    rules:
      # Tests may be long, repetitive, and use unchecked helpers freely.
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - funlen
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/leekli/tamagotchi-go
