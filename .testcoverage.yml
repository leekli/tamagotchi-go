# Config for vladopajic/go-test-coverage: the coverage gate used in CI.
# Thresholds ratchet upward over time — raise them, do not lower them.
profile: cover.out
local-prefix: "github.com/leekli/tamagotchi-go"

threshold:
  file: 75
  package: 80
  total: 90

override:
  # main.go is entrypoint glue exercised by the smoke test, not unit tests.
  # The pattern must match both the package path (cmd/tamagotchi-go) and the
  # file path (cmd/tamagotchi-go/main.go), so it carries no trailing slash.
  - path: ^cmd/tamagotchi-go
    threshold: 0
